; ESP32 adapter for DFRobot DRI0058 SimpleFOCmini.
; Upload is a separate operator action after wiring/configuration review.
[platformio]
default_envs = esp32dev_as5600
[env:esp32dev_open_loop]
; Community-maintained PlatformIO platform providing Arduino-ESP32 3.x,
; required by upstream SimpleFOC 2.4.0's ESP32 MCPWM backend.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:select_program.py
lib_deps =
  https://github.com/simplefoc/Arduino-FOC.git#v2.4.0
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D FOCMINI_USE_AS5600=0
  -D FOCMINI_USE_ACS724=0
[env:esp32dev_as5600]
extends = env:esp32dev_open_loop
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D FOCMINI_USE_AS5600=1
  -D FOCMINI_USE_ACS724=1

[env:esp32dev_acs724_monitor]
extends = env:esp32dev_open_loop
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D FOCMINI_USE_AS5600=0
  -D FOCMINI_USE_ACS724=0
  -D FOCMINI_ACS724_MONITOR_ONLY=1
