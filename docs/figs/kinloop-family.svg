  <title id="t">The motor family</title>
  <desc id="d">Four parameter ranges relative to the reference motor: resistance 0.8 to 1.5, inductance 0.65 to 1.35, back-EMF constant 0.85 to 1.15, rotor inertia 0.5 to 2.0. Frozen populations: 64 training, 16 validation, 16 boundary, 32 final test motors.</desc>
