; Native ESP-IDF build for original ESP32-WROOM through PlatformIO.
; This uses the existing app_main adapter, not the Arduino application.
[platformio]
src_dir = main
default_envs = esp32dev_idf

[env:esp32dev_idf]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = espidf
monitor_speed = 115200
